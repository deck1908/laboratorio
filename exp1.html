<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--verde:#7fcf9b;
--verde-claro:#e9f7ef;
--verde-hover:#5fbf87;
--blanco:#ffffff;
--gris:#f4f6f5;
--texto:#2f3e34;
--borde:#dfeee6;
--sombra:0 10px 30px rgba(0,0,0,.08)
}

body{
font-family:"Segoe UI",Arial,sans-serif;
background:linear-gradient(180deg,#f7fbf9,#eef6f1);
color:var(--texto)
}

.navbar{
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 36px;
position:fixed;
top:0;
z-index:50;
background:rgba(255,255,255,.9);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--borde);
box-shadow:0 4px 20px rgba(0,0,0,.05)
}
.navbar h2{color:var(--verde)}
.navbar ul{display:flex;gap:28px;list-style:none}
.navbar a{
color:#45695a;
text-decoration:none;
font-weight:500;
transition:.3s
}
.navbar a:hover{color:var(--verde-hover)}

.hero{
margin-top:90px;
min-height:260px;
background:
linear-gradient(120deg,rgba(127,207,155,.7),rgba(255,255,255,.9)),
url("https://img.freepik.com/foto-gratis/laboratorio-cientifico-moderno_23-2149306124.jpg")
center/cover;
display:flex;
align-items:center;
justify-content:center
}
.hero h1{
font-size:3rem;
color:#245c3c;
text-align:center;
background:rgba(255,255,255,.85);
padding:18px 36px;
border-radius:18px;
box-shadow:var(--sombra)
}

.content{
max-width:1150px;
margin:auto;
padding:50px 22px 90px
}

.grid-2{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:30px;
margin-bottom:45px
}
.card{
background:var(--blanco);
padding:28px;
border-radius:26px;
border:1px solid var(--borde);
box-shadow:var(--sombra);
transition:.35s
}
.card:hover{
transform:translateY(-6px);
box-shadow:0 18px 40px rgba(0,0,0,.12)
}
.card h3{
color:#2f6f4f;
margin-bottom:14px;
font-size:1.3rem
}
.card ul{padding-left:18px;line-height:1.7}

#sustanciasBox ul li{
margin-bottom:10px
}
.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo img{
height:42px;      
width:auto;       
object-fit:contain;
}

.logo h1{
font-size:1.35rem;
color:var(--verde);
}

h2{
color:#2f6f4f;
font-size:2.1rem;
margin-bottom:30px
}

.steps{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:28px
}
.step{
background:linear-gradient(135deg,#ffffff,#f0faf4);
padding:24px;
border-radius:22px;
border-left:6px solid var(--verde);
line-height:1.65;
box-shadow:var(--sombra);
transition:.3s
}
.step:hover{
transform:translateY(-5px);
background:#ffffff
}
.step strong{color:#c0392b}

footer{
text-align:center;
padding:25px;
background:#ffffff;
border-top:1px solid var(--borde);
color:#6c8f7d;
box-shadow:0 -6px 20px rgba(0,0,0,.04)
}
</style>

</head>
